services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      FIREFLY_API_URL: ${FIREFLY_API_URL}
      FIREFLY_TOKEN: ${FIREFLY_TOKEN}
      BACKEND_PORT: 3001
      COMPANY_TAG: ${COMPANY_TAG:-MnApps}
      START_DATE: ${START_DATE:-2024-01-01}
      INCOME_TAX_RATE: ${INCOME_TAX_RATE:-0.22}
      BUSINESS_TAX: ${BUSINESS_TAX:-800}
      ADVANCE_TAX_RATE: ${ADVANCE_TAX_RATE:-0.40}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      REPORT_EMAILS: ${REPORT_EMAILS}
      REPORT_SCHEDULE_DAY: ${REPORT_SCHEDULE_DAY:-1}
      REPORT_SCHEDULE_TIME: ${REPORT_SCHEDULE_TIME:-08:00}
      IGNORE_FIREFLY_ACCOUNTS: ${IGNORE_FIREFLY_ACCOUNTS:-}
      TRADING212_API_KEY: ${TRADING212_API_KEY:-}
      TRADING212_API_SECRET: ${TRADING212_API_SECRET:-}
      TRADING212_ENV: ${TRADING212_ENV:-live}
      STATISTICS_CACHE_TTL_MINUTES: ${STATISTICS_CACHE_TTL_MINUTES:-15}
      TARGET_ASSET_GOAL: ${TARGET_ASSET_GOAL:-1000000}
      EXPECTED_INVESTMENT_GROWTH_RATE: ${EXPECTED_INVESTMENT_GROWTH_RATE:-0.07}
      SAFE_WITHDRAWAL_RATE: ${SAFE_WITHDRAWAL_RATE:-0.04}
      MONTHLY_INVESTMENT_AMOUNT: ${MONTHLY_INVESTMENT_AMOUNT:-500}
      PROJECTION_HORIZON_YEARS: ${PROJECTION_HORIZON_YEARS:-30}
      APP_PASSWORD: ${APP_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    volumes:
      - ./backend/data:/app/data
    networks:
      - wmm-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_PORT: ${BACKEND_PORT:-3001}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - wmm-network

networks:
  wmm-network:
    driver: bridge
